<style>
  :root{
    --navy:#102A4C; --navy-soft:#1c3b63; --gold:#C5A253; --gold-deep:#9c7d33;
    --ink:#1f2630; --muted:#6a7280; --line:#E7E0CF; --cream:#F7F4EC;
    --card:#ffffff; --shadow:0 1px 2px rgba(16,42,76,.06);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    color:var(--ink); background:var(--cream);
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  h1,h2,h3,.serif{font-family:"Cinzel",serif;letter-spacing:.01em}

  /* ---------- Cabeçalho ---------- */
  header{
    background:var(--navy); color:#fff; padding:18px 20px;
    position:sticky; top:0; z-index:20;
    border-bottom:3px solid var(--gold);
  }
  .head-row{display:flex;align-items:center;gap:14px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .brand .rose{width:34px;height:34px;flex:0 0 auto;color:var(--gold)}
  .brand h1{font-size:20px;margin:0;color:#fff;font-weight:600}
  .brand .sub{font-size:12px;color:#cdd6e3;letter-spacing:.04em}
  .brand-logo{width:40px;height:40px;border-radius:10px;flex:0 0 auto;background:#f3ece0}

  /* ---------- Tela de entrada ---------- */
  #cover{position:fixed;inset:0;z-index:100;background:var(--navy);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .cover-inner{max-width:460px;animation:fadeIn .5s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cover-logo{width:148px;height:148px;border-radius:28px;box-shadow:0 14px 44px rgba(0,0,0,.4)}
  .cover-tag{color:#e7ddc7;font-size:16px;margin:24px auto 0;line-height:1.55;max-width:360px}
  .cover-btn{margin-top:24px;background:var(--gold);color:#1a1305;border:0;border-radius:999px;padding:14px 36px;font-family:"Cinzel",serif;font-size:16px;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:.15s}
  .cover-btn:hover{background:#d8b863}
  .cover-verse{color:#9fb0c6;font-size:13px;margin-top:32px;font-style:italic;font-family:"Cinzel",serif}
  .search{
    display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
    padding:9px 15px;min-width:230px;flex:1 1 240px;max-width:420px;color:var(--ink)
  }
  .search input{border:0;outline:0;font:inherit;width:100%;background:transparent}
  .search svg{width:17px;height:17px;color:var(--muted);flex:0 0 auto}
  .btn-admin{
    background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;
    border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:.15s
  }
  .btn-admin:hover{background:rgba(255,255,255,.12)}
  .btn-admin svg{width:16px;height:16px}

  /* ---------- Filtros ---------- */
  .filters{max-width:1200px;margin:18px auto 0;padding:0 20px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .chip{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:7px 15px;font-size:13.5px;cursor:pointer;color:var(--ink);transition:.15s;white-space:nowrap
  }
  .chip:hover{border-color:var(--gold)}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.drop-target{background:var(--gold);border-color:var(--gold);color:#3a2c08}
  body.dragging-active .chip.droppable{border-style:dashed;border-color:var(--gold)}
  .item.dragging-card{opacity:.4}
  .count{margin-left:auto;font-size:13px;color:var(--muted)}

  /* ---------- Grade ---------- */
  main{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .item{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:.18s;
    display:flex;flex-direction:column
  }
  .item:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(16,42,76,.12);border-color:var(--gold)}
  .thumb{aspect-ratio:4/3;background:#eee9dc center/cover no-repeat;border-bottom:1px solid var(--line)}
  .item .meta{padding:11px 13px}
  .item .meta .t{font-size:14.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .meta .c{font-size:11.5px;color:var(--gold-deep);margin-top:5px;letter-spacing:.03em;text-transform:uppercase}

  .state{text-align:center;color:var(--muted);padding:70px 20px}
  .state .serif{font-size:22px;color:var(--navy);margin-bottom:8px}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Lightbox ---------- */

  .overlay.open{display:flex}

  .viewer-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
  .viewer-bar .vt{font-weight:500}
  .viewer-bar .vc{font-size:12px;color:var(--gold-deep);text-transform:uppercase;letter-spacing:.03em}
  .viewer-bar .grow{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
  .vbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--ink);text-decoration:none}
  .vbtn:hover{border-color:var(--gold)}
  .vbtn svg{width:16px;height:16px}
  .vbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .vbtn.danger{color:#a32d2d;border-color:#f0c0c0}
  .vinput{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;background:#fff}
  .vclose{position:absolute;top:18px;right:22px;background:rgba(255,255,255,.15);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}

  /* ---------- Administração ---------- */
  .panel{position:fixed;inset:0;background:rgba(10,22,40,.5);z-index:40;display:none;justify-content:flex-end}
  .panel.open{display:flex}
  .panel-inner{background:var(--cream);width:min(520px,100%);height:100%;overflow:auto;padding:22px;box-shadow:-6px 0 30px rgba(0,0,0,.2)}
  .panel h2{margin:0 0 4px;color:var(--navy);font-size:20px}
  .panel .lead{color:var(--muted);font-size:14px;margin:0 0 18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;background:#fff}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;background:#fff;cursor:pointer;transition:.15s}
  .drop:hover{border-color:var(--gold);background:#fffdf7}
  .drop.dragging{border-color:var(--gold);background:#fff6e2}
  .drop svg{width:32px;height:32px;color:var(--gold-deep)}
  .drop .big{font-weight:500;margin-top:8px}
  .drop .small{font-size:13px;color:var(--muted);margin-top:4px}
  .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0 6px;display:none}
  .bar.show{display:block}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  .log{font-size:12.5px;color:var(--muted);max-height:160px;overflow:auto;margin-top:8px;white-space:pre-line}
  .pill-btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-size:15px;cursor:pointer;width:100%}
  .pill-btn:hover{background:var(--navy-soft)}
  .pill-btn:disabled{opacity:.5;cursor:default}
  .ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}
  .warn{background:#fff7e6;border:1px solid #f0d999;color:#7a5a12;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:16px}
  .err{background:#fcebeb;border:1px solid #f0b8b8;color:#8a2222;border-radius:10px;padding:11px 13px;font-size:13.5px;margin:12px 0}
  .col-row{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .col-row .cn{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .col-row .cn .cc{font-size:12px;color:var(--muted);font-weight:400}
  .col-row button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}

    .viewer-bar .grow .vbtn{flex:1;justify-content:center;padding:11px 8px}
    .viewer-img img{max-height:58vh}
  }
</style>
</head>

<script>
/* ============ Títulos conhecidos (preenchimento automático) ============ */
const ATLAS_TITLES = [
  "Atlas Visual da Bíblia (capa)","Como usar este atlas","O Mundo Bíblico",
  "Linha do Tempo Bíblica Geral","Como usar este atlas","Mesopotâmia, Egito e Canaã",
  "A Jornada de Abraão","O Egito Bíblico","A Rota do Êxodo","As 12 Tribos de Israel",
  "Jerusalém e o Templo","O Egito Bíblico","A Palestina no Tempo de Jesus",
  "Antigo Oriente Próximo Explicado","Povos Vizinhos de Israel",
  "Rotas Comerciais e Caminhos Antigos","Mares, Rios e Desertos da Bíblia",
  "Montanhas Importantes da Bíblia","As Viagens Missionárias de Paulo",
  "As 7 Igrejas do Apocalipse","Como Ler Mapas Bíblicos","Montanhas Importantes da Bíblia",
  "Cidades Bíblicas Mais Importantes","Jardim do Éden e os Rios de Gênesis",
  "Babel e a Dispersão dos Povos","Ur dos Caldeus e o Chamado de Abraão",
  "A Jornada de Abraão","Canaã no Tempo dos Patriarcas",
  "Sodoma, Gomorra e o Vale do Jordão","Hebrom, Betel e Siquém",
  "Jacó, Esaú e a Formação de Israel","José e o Caminho para o Egito",
  "Gósen — Israel Dentro do Egito","O Mar Vermelho e a Libertação",
  "O Deserto do Sinai","O Monte Sinai e a Entrega da Lei","O Tabernáculo no Caminho",
  "Cades-Barneia e a Incredulidade de Israel","A Entrada em Canaã",
  "Jericó e as Primeiras Conquistas","As 12 Tribos de Israel","Jerusalém e o Templo",
  "O Reino Unido: Saul, Davi e Salomão","O Reino de Davi em Expansão",
  "Reino do Norte e Reino do Sul","Samaria: Capital do Reino do Norte",
  "Judá e Jerusalém","Assíria e a Queda de Israel","Babilônia e o Exílio de Judá"
];

/* Deduz título / coleção a partir do nome do arquivo */
function inferMeta(filename, forcedColecao){
  const base = filename.replace(/\.[^.]+$/,'');
  let m;
  if(forcedColecao && forcedColecao!=="auto"){
    return { titulo: prettyName(base), colecao: forcedColecao, tema: forcedColecao };
  }
  if((m = base.match(/salmos?[-_ ]?0*(\d+)/i))){
    return { titulo:"Salmo "+m[1], colecao:"Salmos em Mapas Visuais", tema:"Salmos" };
  }
  if((m = base.match(/atlas[-_ ]?0*(\d+)/i))){
    const i = parseInt(m[1],10)-1;
    const t = ATLAS_TITLES[i] || ("Atlas — página "+m[1]);
    return { titulo:t, colecao:"Atlas Visual da Bíblia", tema:"Geografia bíblica" };
  }
  return { titulo: prettyName(base), colecao:"Outros", tema:"Outros" };
}
function prettyName(s){
  return s.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase()).trim();
}

/* ============ Estado e Supabase ============ */
let sb=null, items=[], activeCol="Todas", term="", draggingId=null;

function configOk(){
  return CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.includes("COLE_AQUI") &&
         CONFIG.SUPABASE_ANON_KEY && !CONFIG.SUPABASE_ANON_KEY.includes("COLE_AQUI");
}
function publicUrl(path){
  return sb.storage.from(CONFIG.BUCKET).getPublicUrl(path).data.publicUrl;
}

const $=s=>document.querySelector(s);
const grid=$("#grid"), stateEl=$("#state"), filtersEl=$("#filters");

function setState(html){ stateEl.innerHTML=html; stateEl.style.display = html?"block":"none"; }

async function loadItems(){
  if(!configOk()){
    setState('<div class="serif">Quase lá!</div>Abra o arquivo e preencha a chave ANON e o PIN no topo (seção CONFIGURAÇÃO). Depois recarregue.');
    return;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  setState('<div class="spinner"></div>Carregando o acervo...');
  const { data, error } = await sb.from(CONFIG.TABLE).select("*").order("titulo",{ascending:true});
  if(error){
    setState('<div class="err">Não consegui carregar: '+error.message+'<br>Confira se você rodou o SQL de configuração no Supabase.</div>');
    return;
  }
  items = data||[];
  buildFilters();
  render();
  if(adminUnlocked) renderColManage();
  fillColSel();
}

function buildFilters(){
  const cols=["Todas",...Array.from(new Set(items.map(i=>i.colecao).filter(Boolean))).sort()];
  filtersEl.innerHTML = cols.map(c=>
    `<button class="chip${c===activeCol?' active':''}${c!=='Todas'?' droppable':''}" data-col="${c}">${c}</button>`
  ).join("") + `<span class="count" id="count"></span>`;
  filtersEl.querySelectorAll(".chip").forEach(b=>{
    b.onclick=()=>{activeCol=b.dataset.col;buildFilters();render();};
    const col=b.dataset.col;
    if(col!=="Todas"){
      b.addEventListener("dragover",e=>{ if(draggingId){ e.preventDefault(); b.classList.add("drop-target"); }});
      b.addEventListener("dragleave",()=>b.classList.remove("drop-target"));
      b.addEventListener("drop",e=>{ e.preventDefault(); b.classList.remove("drop-target"); moveItemToCollection(draggingId,col); });
    }
  });
}
function clearChipHighlight(){ filtersEl.querySelectorAll(".chip").forEach(c=>c.classList.remove("drop-target")); }
async function moveItemToCollection(id,col){
  const it=items.find(x=>x.id===id);
  if(!it || it.colecao===col) return;
  const { error }=await sb.from(CONFIG.TABLE).update({colecao:col}).eq("id",id);
  if(error){ alert("Não consegui mover: "+error.message); return; }
  await loadItems();
}

function render(){
  const t=term.toLowerCase().trim();
  const list=items.filter(i=>{
    if(activeCol!=="Todas" && i.colecao!==activeCol) return false;
    if(!t) return true;
    const hay=[i.titulo,i.tema,i.colecao,(i.tags||[]).join(" ")].join(" ").toLowerCase();
    return hay.includes(t);
  });
  const cnt=$("#count"); if(cnt) cnt.textContent = list.length+" infográfico"+(list.length===1?"":"s");
  if(!list.length){
    grid.innerHTML="";
    setState(items.length? '<div class="serif">Nada encontrado</div>Tente outro termo ou coleção.'
                         : '<div class="serif">Acervo vazio</div>Entre em Administração para subir suas imagens.');
    return;
  }
  setState("");
  grid.innerHTML=list.map(i=>{
    const url=publicUrl(i.storage_path);
    return `<div class="item" data-id="${i.id}">
      <div class="thumb" style="background-image:url('${url}')"></div>
      <div class="meta"><div class="t">${esc(i.titulo)}</div>
      <div class="c">${esc(i.colecao||"")}</div></div></div>`;
  }).join("");
  grid.querySelectorAll(".item").forEach(el=>{
    el.onclick=()=>openViewer(el.dataset.id);
    el.setAttribute("draggable","true");
    el.addEventListener("dragstart",e=>{
      draggingId=el.dataset.id;
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",el.dataset.id); }catch(_){}
      el.classList.add("dragging-card");
      document.body.classList.add("dragging-active");
    });
    el.addEventListener("dragend",()=>{
      draggingId=null; el.classList.remove("dragging-card");
      document.body.classList.remove("dragging-active"); clearChipHighlight();
    });
  });
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============ Visualizador ============ */
let adminUnlocked=true, current=null;

function collectionsList(){
  return Array.from(new Set(items.map(i=>i.colecao).filter(Boolean))).sort();
}
function fillColSelect(sel, selected){
  sel.innerHTML = collectionsList().map(c=>
    `<option value="${esc(c)}"${c===selected?" selected":""}>${esc(c)}</option>`).join("")
    + `<option value="__nova__">➕ Nova coleção...</option>`;
}
function fillColSel(){
  const sel=$("#colSel"); if(!sel) return;
  const cur=sel.value;
  sel.innerHTML =
    `<option value="auto">Detectar pelo nome do arquivo (recomendado)</option>`
    + collectionsList().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")
    + `<option value="__nova">Outra coleção...</option>`;
  if(cur && [...sel.options].some(o=>o.value===cur)) sel.value=cur;
}

function openViewer(id){
  const i=items.find(x=>x.id===id); if(!i) return;
  current=i;
  $("#vimg").src=publicUrl(i.storage_path);
  $("#vt").textContent=i.titulo; $("#vt").style.display="";
  $("#vc").textContent=i.colecao||""; $("#vc").style.display="";
  $("#vEdit").style.display="none";
  $("#veditBtn").style.display = adminUnlocked? "flex":"none";
  $("#vsaveBtn").style.display = "none";
  $("#vdelete").style.display = adminUnlocked? "flex":"none";
  $("#overlay").classList.add("open");
}
$("#vclose").onclick=()=>$("#overlay").classList.remove("open");
$("#overlay").onclick=e=>{ if(e.target===$("#overlay")) $("#overlay").classList.remove("open"); };

$("#veditBtn").onclick=()=>{
  $("#vtEdit").value=current.titulo;
  fillColSelect($("#vcEdit"), current.colecao||"");
  $("#vEdit").style.display="block";
  $("#vt").style.display="none"; $("#vc").style.display="none";
  $("#veditBtn").style.display="none"; $("#vsaveBtn").style.display="flex";
};
$("#vsaveBtn").onclick=async()=>{
  const novoTitulo=$("#vtEdit").value.trim()||current.titulo;
  let novaColecao=$("#vcEdit").value;
  if(novaColecao==="__nova__"){
    novaColecao=(prompt("Nome da nova coleção:")||"").trim();
    if(!novaColecao) return;
  }
  $("#vsaveBtn").disabled=true;
  const { error }=await sb.from(CONFIG.TABLE).update({titulo:novoTitulo,colecao:novaColecao}).eq("id",current.id);
  $("#vsaveBtn").disabled=false;
  if(error){ alert("Não consegui salvar: "+error.message); return; }
  $("#overlay").classList.remove("open");
  await loadItems();
};
$("#vexport").onclick=()=>{ if(current) exportImage(current); };
$("#vdelete").onclick=async()=>{
  if(!current||!confirm("Remover \""+current.titulo+"\" da galeria?")) return;
  await sb.storage.from(CONFIG.BUCKET).remove([current.storage_path]);
  await sb.from(CONFIG.TABLE).delete().eq("id",current.id);
  $("#overlay").classList.remove("open");
  await loadItems();
};

async function exportImage(it){
  const url=publicUrl(it.storage_path);
  try{
    const res=await fetch(url); if(!res.ok) throw 0;
    const blob=await res.blob();
    const ext=(it.storage_path.split(".").pop()||"jpg").toLowerCase();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(it.titulo||"infografico")+"."+ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){ window.open(url,"_blank"); }
}

/* ============ Gerenciar coleções ============ */
function renderColManage(){
  const box=$("#colManage"); if(!box) return;
  const cols=collectionsList();
  if(!cols.length){ box.innerHTML='<p class="lead" style="margin:0">Nenhuma coleção ainda.</p>'; return; }
  box.innerHTML=cols.map(c=>{
    const n=items.filter(i=>i.colecao===c).length;
    return `<div class="col-row"><div class="cn">${esc(c)} <span class="cc">(${n})</span></div>
      <button data-ren="${esc(c)}">Renomear</button>
      <button class="del" data-del="${esc(c)}">Excluir</button></div>`;
  }).join("");
  box.querySelectorAll("[data-ren]").forEach(b=>b.onclick=()=>renameCollection(b.dataset.ren));
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteCollection(b.dataset.del));
}
async function renameCollection(old){
  const nv=(prompt(`Novo nome para a coleção "${old}":`, old)||"").trim();
  if(!nv||nv===old) return;
  const { error }=await sb.from(CONFIG.TABLE).update({colecao:nv}).eq("colecao",old);
  if(error){ alert("Erro ao renomear: "+error.message); return; }
  if(activeCol===old) activeCol=nv;
  await loadItems();
}
async function deleteCollection(col){
  const rows=items.filter(i=>i.colecao===col);
  if(!confirm(`Excluir a coleção "${col}" e seus ${rows.length} infográfico(s)? Esta ação não tem volta.`)) return;
  const paths=rows.map(r=>r.storage_path);
  for(let k=0;k<paths.length;k+=100){ await sb.storage.from(CONFIG.BUCKET).remove(paths.slice(k,k+100)); }
  const { error }=await sb.from(CONFIG.TABLE).delete().eq("colecao",col);
  if(error){ alert("Erro ao excluir: "+error.message); return; }
  if(activeCol===col) activeCol="Todas";
  await loadItems();
}

function slugify(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");}
function safeName(name){
  const dot=name.lastIndexOf(".");
  const base=dot>0?name.slice(0,dot):name;
  let ext=dot>0?name.slice(dot+1):"";
  ext=ext.toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  return (slugify(base)||"img")+"."+ext;
}
function resetUpload(){
  $("#log").textContent=""; $("#barFill").style.width="0%"; $("#bar").classList.remove("show");
  $("#colSel").value="auto"; $("#newColField").style.display="none"; $("#newCol").value="";
}

async function uploadFiles(fileList){
  const files=[...fileList]; if(!files.length) return;
  let colMode=$("#colSel").value;
  if(colMode==="__nova"){
    const nv=$("#newCol").value.trim();
    if(!nv){ alert("Dê um nome para a nova coleção."); return; }
    colMode=nv;
  }
  const bar=$("#bar"), fill=$("#barFill"), log=$("#log");
  bar.classList.add("show"); log.textContent=""; fill.style.width="0%";
  let done=0, ok=0, fail=0;
  for(const f of files){
    const meta=inferMeta(f.name, colMode);
    const path=`${slugify(meta.colecao||"outros")}/${safeName(f.name)}`;
    try{
      const up=await sb.storage.from(CONFIG.BUCKET).upload(path,f,{upsert:true,contentType:f.type||"image/jpeg"});
      if(up.error) throw up.error;
      const ins=await sb.from(CONFIG.TABLE).upsert(
        { titulo:meta.titulo, colecao:meta.colecao, tema:meta.tema, storage_path:path },
        { onConflict:"storage_path" }
      );
      if(ins.error) throw ins.error;
      ok++; log.textContent += `✓ ${meta.titulo}  →  ${meta.colecao}\n`;
    }catch(err){
      fail++; log.textContent += `✗ ${f.name} — ${err.message}\n`;
    }
    done++; fill.style.width=(done/files.length*100)+"%";
    log.scrollTop=log.scrollHeight;
  }
  log.textContent += `\nConcluído: ${ok} enviado(s)${fail?`, ${fail} com erro`:""}.`;
  await loadItems();
}
$("#fileInput").onchange=e=>{ uploadFiles(e.target.files); e.target.value=""; };
